name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Package Unreal Engine Plugin (Fab)
      run: |
        # Ensure no generated artifacts are present just in case
        rm -rf AgentFramework/Binaries AgentFramework/Intermediate AgentFramework/Saved
        zip -r UE-AgentFramework-Plugin.zip AgentFramework/

    - name: Package AgentFramework Agent Plugin
      run: |
        # Remove any pre-built bridge if it was accidentally committed
        rm -f UnrealEngine/bridge.exe
        zip -r AgentFramework-Agent-Plugin.zip UnrealEngine/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          UE-AgentFramework-Plugin.zip
          AgentFramework-Agent-Plugin.zip
        generate_release_notes: true
